<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Paper Cutout Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>✂️ Paper Cutout Match-Cut Generator</h2>
        <p class="subtitle">Ketik satu kata kunci untuk membuat potongan koran & buku dinamis</p>
    </header>
    
    <div class="controls">
        <input type="text" id="keywordInput" placeholder="Ketik 1 kata..." value="Fokus">
        
        <select id="speedSelect" title="Kecepatan Pergantian Frame">
            <option value="1000">1 Frame / Detik (Lambat)</option>
            <option value="500" selected>2 Frame / Detik (Normal)</option>
            <option value="250">4 Frame / Detik (Cepat)</option>
            <option value="150">6+ Frame / Detik (Agresif)</option>
        </select>

        <select id="bgModeSelect" title="Mode Latar Belakang">
            <option value="dark" selected>Meja Gelap (Estetik)</option>
            <option value="greenscreen">Green Screen (Untuk CapCut)</option>
        </select>

        <button onclick="startPreview()">▶️ Putar Pratinjau</button>
        <button class="stop-btn" onclick="stopPreview()">⏹️ Berhenti</button>
        <button class="record-btn" onclick="recordVideo()">🔴 Rekam Video (5 Detik)</button>
    </div>

    <main class="canvas-wrapper">
        <canvas id="paperCanvas" width="720" height="1280"></canvas>
    </main>

    <div class="status" id="statusText">Siap digunakan. Kata akan terkunci di tengah dengan potongan kertas acak.</div>

    <script src="script.js"></script>
</body>
</html>
