<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Paper Cutout Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>✂️ Paper Cutout Match-Cut Generator</h2>
        <p class="subtitle">Generator ratusan variasi potongan buku & koran kecepatan tinggi</p>
    </header>
    
    <div class="controls">
        <input type="text" id="keywordInput" placeholder="Ketik 1 kata..." value="Fokus">
        
        <select id="speedSelect" title="Kecepatan Pergantian Klip">
            <option value="500">2 Klip / Detik (Normal)</option>
            <option value="250">4 Klip / Detik (Cepat)</option>
            <option value="150">6.6 Klip / Detik (Agresif)</option>
            <option value="125" selected>8 Klip / Detik (Sangat Cepat)</option>
            <option value="80">12.5 Klip / Detik (Ekstrem)</option>
        </select>

        <select id="highlightModeSelect" title="Gaya Penanda Kata">
            <option value="stabilo" selected>Ditandai Stabilo (Warna Penuh)</option>
            <option value="subtle">Hanya Disorot (Garis & Tebal)</option>
            <option value="none">Tanpa Tanda (Teks Menyatu)</option>
        </select>

        <select id="bgModeSelect" title="Mode Latar Belakang">
            <option value="dark" selected>Meja Gelap (Estetik)</option>
            <option value="greenscreen">Green Screen (Untuk CapCut)</option>
        </select>

        <button onclick="startPreview()">▶️ Putar Pratinjau</button>
        <button class="stop-btn" onclick="stopPreview()">⏹️ Berhenti</button>
        <button class="record-btn" onclick="recordVideo()">🔴 Rekam Video (5 Detik)</button>
    </div>

    <main class="canvas-wrapper">
        <canvas id="paperCanvas" width="720" height="1280"></canvas>
    </main>

    <div class="status" id="statusText">Siap digunakan. Ratusan variasi halaman & font siap diputar.</div>

    <script src="script.js"></script>
</body>
</html>
